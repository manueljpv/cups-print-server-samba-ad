# Trechos de /etc/cups/cupsd.conf (valores de exemplo)

# Escutar somente em IPv4, em todas as interfaces
Listen 0.0.0.0:631

# Um "Allow" por sub-rede de usuarios
<Location />
  Order allow,deny
  Allow 192.0.2.0/24
  Allow 198.51.100.0/24
  Allow 203.0.113.0/24
</Location>

# No Ubuntu 24.04 o PageLogFormat vem em branco e desabilita o page_log
PageLogFormat %p %u %j %T %P %C %{job-billing} %{job-originating-host-name} %{job-name} %{media} %{sides} %{print-color-mode}

# PreserveJobFiles so deve ficar ligado para diagnostico (o arquivo do job
# contem o PIN codificado). Mantenha desligado em producao.
PreserveJobFiles No
